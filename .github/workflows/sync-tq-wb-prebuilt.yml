name: Sync tq-wb-prebuilt

# Rebuilds tq-wb-prebuilt from EVPilot's rel + torque branches whenever either changes.
on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if EVPilot hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-tq-wb-prebuilt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          ORIGIN: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          FORCE: ${{ inputs.force && '1' || '0' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/build_tq_wb_prebuilt.sh
